name: Console release candidates

on:
  workflow_dispatch:
  pull_request:
    # The native matrix is a release checkpoint, not per-commit CI. Run it once
    # when review starts, or rerun it deliberately with the
    # `ci:release-candidate` label (remove and re-add the label to rerun).
    types: [opened, reopened, ready_for_review, converted_to_draft, labeled]
    paths:
      - .github/workflows/console-release-candidate.yml
      - .github/workflows/console-draft-release.yml
      - Makefile
      - tools/licenses/**
      - workspaces/hees-console/**

permissions:
  contents: read

concurrency:
  group: console-release-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.draft == false && github.event.action != 'labeled')
      || (github.event.pull_request.draft == false && github.event.label.name == 'ci:release-candidate')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Hees.ai
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@d0befba8b9ddf874327619e84c39b094edd58b66 # 1.93.0
      - name: Install checksum-pinned actionlint 1.7.12
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_URL: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --location --proto '=https' --tlsv1.2 "$ACTIONLINT_URL" --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          printf '%s\n' "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Validate release mechanics and workflows
        run: make console-release-lint console-release-contract-test console-release-set-test
      - name: Install pinned license-audit tools
        run: |
          cargo install cargo-deny --version 0.19.0 --locked
          cargo install cargo-about --version 0.9.1 --locked --features cli
      - name: Build pinned Incan for dependency audit
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/incan-0.5.0-dev.23"
          workspaces/hees-console/packaging/release_candidate.sh \
            prepare-incan \
            --platform linux-x86_64 \
            --destination "$install_root"
          {
            echo "INCAN_HOME=$RUNNER_TEMP/incan-home"
            echo "INCAN_STDLIB=$install_root/source/crates/incan_stdlib/stdlib"
            echo "INCAN_TOOLCHAIN_CRATES_DIR=$install_root/source/crates"
          } >> "$GITHUB_ENV"
      - name: Audit the locked native license graph
        run: >-
          make console-license-audit
          INCAN="$RUNNER_TEMP/incan-0.5.0-dev.23/bin/incan"

  build:
    needs: validate
    name: Build ${{ matrix.platform }} candidate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: macos-aarch64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
    env:
      RELEASE_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Check out Hees.ai
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Configure release paths
        run: |
          install_root="$RUNNER_TEMP/incan-0.5.0-dev.23"
          {
            echo "INCAN_ROOT=$install_root"
            echo "INCAN_HOME=$RUNNER_TEMP/incan-home"
            echo "INCAN_STDLIB=$install_root/source/crates/incan_stdlib/stdlib"
            echo "INCAN_TOOLCHAIN_CRATES_DIR=$install_root/source/crates"
            echo "RELEASE_OUTPUT=$RUNNER_TEMP/hees-console-release"
          } >> "$GITHUB_ENV"
      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@d0befba8b9ddf874327619e84c39b094edd58b66 # 1.93.0
      - name: Install pinned license-audit tools
        run: |
          cargo install cargo-deny --version 0.19.0 --locked
          cargo install cargo-about --version 0.9.1 --locked --features cli
      - name: Build commit-pinned Incan 0.5 development toolchain
        run: |
          set -euo pipefail
          workspaces/hees-console/packaging/release_candidate.sh prepare-incan --platform "$RELEASE_PLATFORM" --destination "$INCAN_ROOT"
      - name: Build and clean-smoke the release archive
        run: >-
          make console-release-candidate
          INCAN="$INCAN_ROOT/bin/incan"
          RELEASE_PLATFORM="$RELEASE_PLATFORM"
          RELEASE_OUTPUT="$RELEASE_OUTPUT"
      - name: Verify immutable source identity
        env:
          RELEASE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
          grep -F '"commit":"'"$RELEASE_SOURCE_SHA"'"' \
            "$RELEASE_OUTPUT/hees-console-0.1.0-$RELEASE_PLATFORM.manifest.json"
      - name: Upload untrusted release-candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hees-console-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/hees-console-release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: false
