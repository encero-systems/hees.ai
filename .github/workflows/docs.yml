name: Docs

on:
  push:
    branches: [main]
    paths:
      - "workspaces/docs-site/**"
      - "Makefile"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "workspaces/docs-site/**"
      - "Makefile"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build mdBook site
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Hees.ai
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install checksum-pinned mdBook 0.5.4
        env:
          MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7
          MDBOOK_URL: https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl --fail --location --proto '=https' --tlsv1.2 "$MDBOOK_URL" --output "$RUNNER_TEMP/mdbook.tar.gz"
          printf '%s  %s\n' "$MDBOOK_SHA256" "$RUNNER_TEMP/mdbook.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/mdbook" mdbook
          printf '%s\n' "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"
      - name: Build documentation
        run: make docs
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: workspaces/docs-site/site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
