name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7
    steps:
      - name: Check out Hees.ai
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - name: Verify runner tools
        run: |
          command -v curl
          command -v grep
          command -v sha256sum
      # The release archive carries the prebuilt standard-library SDK that Oven bakes link against; a bare source
      # build of the compiler does not.
      - name: Install checksum-pinned Incan 0.5.1 release toolchain
        env:
          INCAN_ARCHIVE_URL: https://github.com/encero-systems/incan/releases/download/v0.5.1/incan-v0.5.1-x86_64-unknown-linux-gnu.tar.gz
          INCAN_ARCHIVE_SHA256: b01639acc1209329881a2faa9879a0f303d9f404bd013b3decadaec166c857e4
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/incan-0.5.1"
          archive="$RUNNER_TEMP/incan.tar.gz"
          mkdir -p "$install_root"
          curl --fail --location --proto '=https' --tlsv1.2 "$INCAN_ARCHIVE_URL" --output "$archive"
          printf '%s  %s\n' "$INCAN_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_root"
          test "$("$install_root/bin/incan" --version)" = "incan 0.5.1"
          # Oven bakes run Cargo offline against the toolchain's locked support crates.
          cargo fetch --locked --manifest-path "$install_root/crates/Cargo.toml"
          {
            echo "INCAN_BIN=$install_root/bin/incan"
            echo "INCAN_HOME=$RUNNER_TEMP/incan-home"
          } >> "$GITHUB_ENV"
      - name: Install checksum-pinned mdBook 0.5.4
        env:
          MDBOOK_URL: https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/mdbook-0.5.4"
          archive="$RUNNER_TEMP/mdbook.tar.gz"
          mkdir -p "$install_root"
          curl --fail --location --proto '=https' --tlsv1.2 "$MDBOOK_URL" --output "$archive"
          printf '%s  %s\n' "$MDBOOK_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_root" mdbook
          test "$("$install_root/mdbook" --version)" = "mdbook v0.5.4"
          printf '%s\n' "$install_root" >> "$GITHUB_PATH"
      - name: Prefetch declared Rust crates for offline Oven bakes
        run: make rust-prefetch
      - name: Verify repository
        run: make ci INCAN="$INCAN_BIN"
