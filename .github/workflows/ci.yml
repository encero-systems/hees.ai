name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7
    steps:
      - name: Check out Hees
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@d0befba8b9ddf874327619e84c39b094edd58b66 # 1.93.0
      - name: Verify runner tools
        run: |
          command -v curl
          command -v grep
          command -v sha256sum
      - name: Build pinned Incan 0.5 development toolchain
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/incan-0.5.0-dev.19"
          workspaces/hees-console/packaging/release_candidate.sh \
            prepare-incan \
            --platform linux-x86_64 \
            --destination "$install_root"
          echo "INCAN_BIN=$install_root/bin/incan" >> "$GITHUB_ENV"
      - name: Install checksum-pinned mdBook 0.5.4
        env:
          MDBOOK_URL: https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/mdbook-0.5.4"
          archive="$RUNNER_TEMP/mdbook.tar.gz"
          mkdir -p "$install_root"
          curl --fail --location --proto '=https' --tlsv1.2 "$MDBOOK_URL" --output "$archive"
          printf '%s  %s\n' "$MDBOOK_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_root" mdbook
          test "$("$install_root/mdbook" --version)" = "mdbook v0.5.4"
          printf '%s\n' "$install_root" >> "$GITHUB_PATH"
      - name: Verify repository
        run: make ci INCAN="$INCAN_BIN"
