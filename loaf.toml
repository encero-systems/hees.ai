[project]
name = "hees_ai"
version = "0.0.1"
description = "Incan-first contracts for admitting governed AI proposals"
authors = ["Encero Systems"]
license = "Apache-2.0"
readme = "README.md"

[workspace]
members = [
    "examples/minimal_governed_agent",
    "workspaces/external-consumer",
    "workspaces/hees-console",
    "workspaces/hees-console/runner",
    "workspaces/hees-console/contracts/domain/kernel_compatibility",
]
default-members = [
    "hees_ai",
    "minimal_governed_agent",
    "hees_external_consumer",
    "hees_console",
    "hees_runner",
    "console_kernel_compatibility",
]

[workspace.dependencies]
hees_ai = { path = "." }

[workspace.rust-dependencies]
crossterm = "0.29"
unicode-width = "0.2"
unicode-segmentation = "=1.12.0"
ureq = { version = "2.12", features = ["tls"] }
