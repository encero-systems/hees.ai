[book]
title = "hees.ai documentation"
description = "Checked contracts and developer guidance for the Incan-first Hees governance runtime"
authors = ["Encero Systems"]
language = "en"
src = "docs"

[build]
build-dir = "site"
create-missing = false

[output.html]
git-repository-url = "https://github.com/encero-systems/hees.ai"
edit-url-template = "https://github.com/encero-systems/hees.ai/edit/main/workspaces/docs-site/{path}"
site-url = "/hees.ai/"
no-section-label = true
additional-css = ["theme/hees.css"]

[output.html.search]
enable = true

[output.html.print]
enable = true
